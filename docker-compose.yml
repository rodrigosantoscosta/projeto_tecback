services:
  oficina-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./logs:/app/logs/
    restart: unless-stopped

  oficina-tests:
    build:
      context: .
      target: build
    container_name: oficina-tests
    command: mvn test
    profiles:
      - test