services:

  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: oficina_user
      POSTGRES_PASSWORD: oficina_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_user -d oficina_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  oficina-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./logs:/app/logs/
    restart: unless-stopped

  oficina-tests:
    build:
      context: .
      target: build
    container_name: oficina-tests
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
    command: ["mvn", "test", "-Dspring.profiles.active=test"]
    profiles:
      - test

  postgres-e2e:
    image: postgres:16-alpine
    container_name: oficina-postgres-e2e
    restart: unless-stopped
    environment:
      POSTGRES_DB: oficina_e2e_db
      POSTGRES_USER: oficina_user
      POSTGRES_PASSWORD: oficina_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_user -d oficina_e2e_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - test

  oficina-e2e-tests:
    build:
      context: .
      target: build
    container_name: oficina-e2e-tests
    depends_on:
      postgres-e2e:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: e2e
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
    command: ["mvn", "test", "-Dspring.profiles.active=e2e"]
    profiles:
      - test

  crm-oficina:
    build:
      context: ./crm-oficina
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: crm-oficina
    ports:
      - "3000:80"
    depends_on:
      - oficina-app

volumes:
  postgres_data:
