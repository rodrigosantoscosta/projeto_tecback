spring.datasource.url=jdbc:postgresql://postgres-e2e:5432/oficina_e2e_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=oficina_user
spring.datasource.password=oficina_pass

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.flyway.enabled=false

jwt.secret=test-secret-para-testes-com-64-chars-minimo-xxxxxxxxxxxxxxxxxxxxxxxxxxxx
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

logging.level.br.com.oficina=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
