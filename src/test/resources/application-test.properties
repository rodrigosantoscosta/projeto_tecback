# --- DATABASE (PostgreSQL via Docker — usado nos testes) ---
spring.datasource.url=jdbc:postgresql://postgres:5432/oficina_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=oficina_user
spring.datasource.password=oficina_pass

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-on-validation-error=false

# --- JWT ---
jwt.secret=test-secret-para-testes-docker-minimo-64-chars-xxxxxxxxxxxxxxxxxx
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
