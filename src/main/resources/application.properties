spring.application.name=oficina

# --- DATABASE (PostgreSQL local) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/oficina_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=oficina_user
spring.datasource.password=oficina_pass

# --- JPA / HIBERNATE ---
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# --- JWT ---
jwt.secret=local-dev-secret-nao-usar-em-producao-minimo-64-chars-xxxxxxxxxxx
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# --- LOGGING ---
logging.level.root=INFO
logging.level.br.com.oficina=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%15.15thread] %-40.40logger{39} : %msg%n
logging.file.name=logs/oficina.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.level.org.hibernate=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=WARN

spring.profiles.active=docker
