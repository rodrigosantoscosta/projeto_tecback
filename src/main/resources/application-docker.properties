# --- DATABASE (PostgreSQL via Docker) ---
spring.datasource.url=jdbc:postgresql://postgres:5432/oficina_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=oficina_user
spring.datasource.password=oficina_pass

# --- H2 Console DESABILITADO ---
spring.h2.console.enabled=false

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JPA
spring.jpa.open-in-view=false

# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT ---
jwt.secret=docker-local-secret-nao-usar-em-producao-minimo-64-chars-xxxxxxxx
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
