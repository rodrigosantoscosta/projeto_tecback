name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina_user
          POSTGRES_PASSWORD: oficina_pass
          POSTGRES_DB: oficina_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oficina_user -d oficina_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U oficina_user -d oficina_db; do
            echo "Aguardando PostgreSQL..."
            sleep 2
          done

      - name: Compile
        run: ./mvnw compile -B

      - name: Run tests
        run: ./mvnw test -B
        env:
          SPRING_PROFILES_ACTIVE: ci

      - name: Package JAR
        run: ./mvnw package -B -DskipTests
        env:
          SPRING_PROFILES_ACTIVE: ci

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: oficina-jar
          path: target/oficina-0.0.1-SNAPSHOT.jar
          retention-days: 30
