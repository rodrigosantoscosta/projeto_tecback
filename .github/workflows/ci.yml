name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fix Maven wrapper permission
        run: chmod +x ./mvnw

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: ./mvnw compile -B

      - name: Run unit tests
        run: ./mvnw test -B

      - name: Package JAR
        run: ./mvnw package -B -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: oficina-jar
          path: target/oficina-0.0.1-SNAPSHOT.jar
          retention-days: 30
